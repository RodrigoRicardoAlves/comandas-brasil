# /etc/nginx/sites-available/comandas — na frente do gunicorn
server {
    listen 80;
    server_name comandasbrasil.com.br www.comandasbrasil.com.br bar.rodrigoricardo.eng.br;
    client_max_body_size 10m;               # fotos do cardápio

    location /static/ { alias /srv/comandas/servidor/staticfiles/; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /media/  { alias /srv/comandas/servidor/media/; expires 7d; }
    location = /app/comandas.apk { alias /srv/comandas/servidor/media/app/comandas.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="comandas-brasil.apk"'; }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # a Cloudflare/certbot põe https
        proxy_read_timeout 60s;
    }
}
