{% extends "painel/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h1>Painel do gerente</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    <p>{{ form.bar.label_tag }}{{ form.bar }}</p>
    <p>{{ form.pin.label_tag }}{{ form.pin }}</p>
    <button class="btn prim" type="submit">Entrar</button>
  </form>
  <p class="suave" style="margin-top:14px">Use o mesmo PIN de gerente do app.</p>
</div>
{% endblock %}
